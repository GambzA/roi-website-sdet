<!DOCTYPE html>
<html lang="en" class="scheme-dark bg-ink">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — Roi Mark Gamba</title>
<meta name="description" content="Get in touch with Roi Mark Gamba, SDET and software engineer.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2303171a'/%3E%3Crect x='7' y='7' width='18' height='18' fill='%2349e9a6'/%3E%3C/svg%3E">
<link rel="stylesheet" href="dist/styles.css">
</head>
<body class="overflow-x-hidden bg-ink font-sans text-body leading-[1.5] text-fg antialiased [font-synthesis-weight:none] selection:bg-raised selection:text-line"
      data-page="contact">

<a class="absolute top-0 -left-[999px] z-50 bg-raised px-4 py-3 font-mono text-micro leading-none font-medium tracking-[0.12em] text-line focus:left-0"
   href="#main">Skip to content</a>

<!-- ============================================================ MASTHEAD -->
<header class="flex flex-wrap items-baseline gap-x-8 gap-y-2 border-b border-rule-strong bg-bar px-pad py-4">
  <a class="text-small font-bold uppercase tracking-[0.16em] text-line" href="index.html">Roi Mark Gamba <span class="text-pink">·</span> SDET</a>
</header>

<main id="main" class="bg-panel">

  <!-- ============================================================== HERO -->
  <section class="px-pad pt-[clamp(3rem,8vw,8rem)] pb-[clamp(2.5rem,5vw,5rem)]" data-testid="hero">
    <h1 class="max-w-[20ch] text-title leading-[0.98] font-bold tracking-[-0.03em] text-balance text-line"
        data-testid="headline">
      Thanks for the visit. I’d be happy to have a chat with you soon!
    </h1>
  </section>

  <!-- =========================================================== CONTACT -->
  <section class="border-t border-rule px-pad pt-[clamp(2rem,4vw,3.5rem)] pb-band" data-testid="contact">
    <div class="mb-[clamp(1.5rem,3vw,2.75rem)] flex items-center gap-3 text-h3 text-line before:h-[2px] before:w-9 before:flex-none before:bg-pink before:content-['']">
      <h2 class="uppercase tracking-[0.14em]">Email</h2>
    </div>
    <p>
      <a class="inline-block pb-[0.2em] text-mail leading-none font-bold tracking-[-0.035em] break-words text-line
                shadow-[inset_0_-0.06em_0_0_var(--color-mint)] [transition:box-shadow_0.2s_ease,color_0.2s_ease]
                hover:text-mint hover:shadow-[inset_0_-0.5em_0_0_rgba(73,233,166,0.12)]"
         href="mailto:gambaroimark@gmail.com" data-testid="email">gambaroimark@gmail.com</a>
    </p>
  </section>

  <!-- =============================================================== CTA -->
  <section class="border-t border-rule-strong bg-ink px-pad py-[clamp(2.5rem,5vw,4.5rem)]" data-testid="cta">
    <div class="grid grid-cols-12 gap-gap">
      <p class="col-span-12 wide:col-span-1 text-[clamp(2rem,5vw,4rem)] leading-none text-pink" aria-hidden="true">←</p>
      <div class="col-span-12 wide:col-span-9">
        <p class="mb-[0.9rem] font-mono text-micro tracking-[0.14em] text-dim uppercase">Run again</p>
        <p class="text-lede leading-[1.12] font-medium tracking-[-0.02em] text-pretty text-line wide:max-w-[28ch]">Any spec re-runs on click. Thanks for reading!</p>
      </div>
    </div>
  </section>

</main>

<!-- ============================================================ COLOPHON -->
<footer class="flex flex-wrap items-center gap-x-8 gap-y-3 border-t border-rule-strong bg-bar px-pad py-5 font-mono text-micro tracking-[0.14em] text-dim uppercase">
  <span>© 2026 <b class="font-medium text-line">Roi Mark Gamba</b> — SDET &amp; Software Engineer</span>
</footer>

</body>
</html>
