<!DOCTYPE html>
<!--
  Source for assets/og-cover.png (the Open Graph / Twitter card image).
  Not a published page — robots.txt disallows /src/.

  To regenerate after editing, from the repo root:
    npx playwright screenshot --viewport-size=1200,630 --wait-for-timeout=1500 \
      src/og-image.html assets/og-cover.png

  1200x630 is the 1.91:1 ratio Facebook, LinkedIn and X all crop to.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Roi Mark Gamba — social card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800;900&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    background: #071a35; color: #fff;
    font-family: Archivo, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* Same blueprint + dot field the site draws behind its ink bands. */
  .grid, .dots, .wash { position: absolute; inset: 0; }
  .grid {
    background-image:
      linear-gradient(to right, rgba(255,255,255,.06) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,.06) 1px, transparent 1px);
    background-size: 64px 64px;
  }
  .dots {
    background-image: radial-gradient(rgba(255,255,255,.14) 1.2px, transparent 1.2px);
    background-size: 22px 22px; opacity: .5;
  }
  .wash {
    background: radial-gradient(circle at 12% 50%, rgba(61,114,192,.5), transparent 55%);
  }
  .inner {
    position: relative; height: 100%;
    display: grid; grid-template-columns: 1fr 400px;
    align-items: center; gap: 56px; padding: 64px 72px;
  }
  .mono {
    font-weight: 800; font-size: 34px; letter-spacing: -.04em; color: #fff;
    display: flex; align-items: center; gap: 14px;
  }
  .mono::after {
    content: ""; width: 46px; height: 2px; background: #7aa3dd; display: block;
  }
  h1 {
    font-size: 78px; font-weight: 800; line-height: .98; letter-spacing: -.035em;
    margin: 34px 0 0;
  }
  .role { font-size: 30px; font-weight: 600; color: #7aa3dd; margin-top: 20px; line-height: 1.25; }
  .role span { display: block; color: rgba(255,255,255,.62); font-weight: 500; font-size: 25px; }
  .pills { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 34px; }
  .pill {
    border: 1px solid rgba(255,255,255,.28); border-radius: 999px;
    padding: 7px 16px; font-size: 16px; color: rgba(255,255,255,.85);
  }
  .pill.on { border-color: rgba(122,163,221,.75); background: rgba(122,163,221,.16); color: #b3caee; }
  .domain {
    position: absolute; left: 72px; bottom: 52px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 20px; letter-spacing: .06em; color: rgba(255,255,255,.55);
  }
  figure {
    justify-self: end; width: 360px; aspect-ratio: 4/5;
    border-radius: 18px; overflow: hidden;
    border: 1px solid rgba(255,255,255,.18);
    box-shadow: 0 30px 70px rgba(0,0,0,.45);
  }
  figure img { width: 100%; height: 100%; object-fit: cover; display: block; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="dots"></div>
  <div class="wash"></div>

  <div class="inner">
    <div>
      <div class="mono">RG</div>
      <h1>Roi Mark Gamba</h1>
      <p class="role">
        Software Development Engineer in Test
        <span>&amp; Full-Stack Developer</span>
      </p>
      <div class="pills">
        <span class="pill on">Playwright</span>
        <span class="pill">Java</span>
        <span class="pill">Python</span>
        <span class="pill">AWS</span>
        <span class="pill on">Agentic AI</span>
      </div>
    </div>
    <figure><img src="../assets/photo.png" alt=""></figure>
  </div>

  <div class="domain">roigamba.dev</div>
</body>
</html>
